<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot for Farmers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .chatbox {
      width: 90%;
      max-width: 600px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow-y: auto;
      height: 70vh;
    }
    .message {
      margin: 10px 0;
    }
    .user {
      text-align: right;
      color: blue;
    }
    .bot {
      text-align: left;
      color: green;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }
    #inputArea {
      display: flex;
      width: 90%;
      max-width: 600px;
    }
    #userInput {
      flex: 1;
    }
  </style>
</head>
<body>
  <h2>🌾 விவசாயிகளுக்கான செயற்கை நுண்ணறிவு உதவியாளர்</h2>
  <div class="chatbox" id="chatbox"></div>
  <div id="inputArea">
    <input type="text" id="userInput" placeholder="உங்கள் விவசாயக் கேள்வியை இங்கே எழுதுங்கள்..." />
    <button onclick="sendMessage()">அனுப்பு</button>
  </div>

  <script>
    const API_KEY = "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"; // replace this with your real key

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const msg = input.value.trim();
      if (!msg) return;

      addMessage("user", msg);
      input.value = "";

      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${API_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [
            { role: "system", content: "You are a helpful assistant that gives farming advice to Indian farmers in Tamil in simple, friendly language." },
            { role: "user", content: msg }
          ]
        })
      });

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content || "மன்னிக்கவும், பதிலை பெற முடியவில்லை.";
      addMessage("bot", reply);
    }

    function addMessage(sender, text) {
      const chatbox = document.getElementById("chatbox");
      const div = document.createElement("div");
      div.className = `message ${sender}`;
      div.textContent = `${sender === "user" ? "👨‍🌾 நீங்கள்" : "🤖 உதவியாளர்"}: ${text}`;
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
